apiVersion: v1
kind: Service
metadata:
  name: finpulse-engine-service
  namespace: default
  labels:
    app: finpulse-engine
spec:
  type: ClusterIP
  selector:
    app: finpulse-engine
  ports:
  - name: http
    port: 8055
    targetPort: 8055
    protocol: TCP
  sessionAffinity: None
---
# Optional: LoadBalancer service for external access
apiVersion: v1
kind: Service
metadata:
  name: finpulse-engine-lb
  namespace: default
  labels:
    app: finpulse-engine
spec:
  type: LoadBalancer
  selector:
    app: finpulse-engine
  ports:
  - name: http
    port: 80
    targetPort: 8055
    protocol: TCP
